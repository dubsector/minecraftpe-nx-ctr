name: build-3ds

on:
  push:
    branches: [fix/o3ds-heap-panic]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS portlibs
        run: dkp-pacman -Sy --noconfirm --needed 3ds-libpng 3ds-zlib || true

      # nova_frame_begin/end were removed upstream on 2026-04-06,
      # so pin to the last commit whose API matches main_ctr.h.
      - name: Checkout NovaGL
        uses: actions/checkout@v4
        with:
          repository: efimandreev0/NovaGL
          ref: d4da9703133b961e988cac3e7965dfafe7fe0c37
          path: _novagl

      - name: Build and install NovaGL
        run: |
          set -x
          cd _novagl
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake -DGL2CITRO3D_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)

      - name: Build 3DS target
        run: |
          set -x
          cmake -DPUBLISH=on -B build -S handheld/project/ctr
          cmake --build build -j$(nproc)

      - name: Upload ELF and 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: ctr-build
          path: |
            build/minecraftcpp.elf
            build/minecraftcpp.3dsx

  package-cia:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ctr-build
          path: build

      # makerom needs a newer glibc than the devkitPro image ships,
      # so packaging runs on the plain runner.
      - name: Fetch CIA tooling
        run: |
          set -x
          mkdir -p /tmp/tools && cd /tmp/tools
          curl -sfLO https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -oq makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sfLo bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -oq bannertool.zip -d bt

      - name: Package CIA
        run: |
          set -x
          T=/tmp/tools
          CTR=handheld/project/ctr
          MAKEROM=$T/makerom
          BT=$T/bt/linux-x86_64/bannertool
          chmod +x "$MAKEROM" "$BT"
          "$BT" makebanner -i $CTR/banner.png -a $CTR/audio.wav -o /tmp/banner.bnr
          "$BT" makesmdh -s "Minecraft PE" -l "Minecraft PE for 3DS" -p "efimandreev0" -i $CTR/icon.png -o /tmp/icon.icn
          mkdir -p romfs
          "$MAKEROM" -f cia -o build/minecraftcpp.cia -elf build/minecraftcpp.elf \
            -rsf $CTR/app.rsf -icon /tmp/icon.icn -banner /tmp/banner.bnr \
            -exefslogo -target t
          ls -la build/minecraftcpp.cia

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-3ds-cia
          path: |
            build/minecraftcpp.cia
            build/minecraftcpp.3dsx
