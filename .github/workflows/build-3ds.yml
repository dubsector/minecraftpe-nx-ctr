name: build-3ds

on:
  push:
    branches: [fix/o3ds-heap-panic]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout port
        uses: actions/checkout@v4

      - name: Install 3DS portlibs
        run: dkp-pacman -Sy --noconfirm --needed 3ds-libpng 3ds-zlib || true

      # nova_frame_begin/end were removed upstream on 2026-04-06,
      # so pin to the last commit whose API matches main_ctr.h.
      - name: Checkout NovaGL
        uses: actions/checkout@v4
        with:
          repository: efimandreev0/NovaGL
          ref: d4da9703133b961e988cac3e7965dfafe7fe0c37
          path: _novagl

      - name: Build and install NovaGL
        run: |
          set -x
          cd _novagl
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/3DS.cmake -DGL2CITRO3D_BUILD_EXAMPLES=OFF
          cmake --build build -j$(nproc)
          find build -name 'libNovaGL*.a' -exec cp -v {} $DEVKITPRO/portlibs/3ds/lib/ \;
          cp -rv include/* $DEVKITPRO/portlibs/3ds/include/

      - name: Build 3DS target
        run: |
          set -x
          cmake -DPUBLISH=on -B build -S handheld/project/ctr
          cmake --build build -j$(nproc)

      - name: List build output
        if: always()
        run: find build -maxdepth 2 -type f \( -name '*.3dsx' -o -name '*.elf' -o -name '*.smdh' \) -exec ls -la {} \; || true

      - name: Fetch CIA tooling
        run: |
          set -x
          apt-get update -qq && apt-get install -y -qq curl unzip || true
          mkdir -p /tmp/tools && cd /tmp/tools
          curl -sfLO https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip -oq makerom-v0.19.0-ubuntu_x86_64.zip
          curl -sfLo bannertool.zip https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip
          unzip -oq bannertool.zip -d bt
          find /tmp/tools -type f | head -30

      - name: Package CIA
        run: |
          set -x
          T=/tmp/tools
          CTR=handheld/project/ctr
          MAKEROM=$(find $T -maxdepth 2 -type f -name 'makerom*' ! -name '*.zip' | head -1)
          BT=$(find $T/bt -type f | grep -iE 'linux' | head -1)
          [ -z "$BT" ] && BT=$(find $T/bt -type f ! -name '*.zip' | head -1)
          chmod +x "$MAKEROM" "$BT"
          "$BT" makebanner -i $CTR/banner.png -a $CTR/audio.wav -o /tmp/banner.bnr
          "$BT" makesmdh -s "Minecraft PE" -l "Minecraft PE for 3DS" -p "efimandreev0" -i $CTR/icon.png -o /tmp/icon.icn
          mkdir -p romfs
          "$MAKEROM" -f cia -o build/minecraftcpp.cia -elf build/minecraftcpp.elf             -rsf $CTR/app.rsf -icon /tmp/icon.icn -banner /tmp/banner.bnr             -exefslogo -target t
          ls -la build/minecraftcpp.cia

      - name: Probe CIA tooling
        if: always()
        run: |
          echo "--- tools/bin ---"; ls $DEVKITPRO/tools/bin 2>/dev/null
          echo "--- makerom? ---"; command -v makerom || echo NO_MAKEROM
          echo "--- bannertool? ---"; command -v bannertool || echo NO_BANNERTOOL
          echo "--- cmake ctr_ functions ---"
          grep -rhoE "function\(ctr_[a-z_]+" $DEVKITPRO/cmake/*.cmake 2>/dev/null | sort -u
          echo "--- pacman candidates ---"
          dkp-pacman -Ss makerom 2>/dev/null | head -5
          dkp-pacman -Ss 3dstools 2>/dev/null | head -5

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraftpe-3ds
          path: |
            build/*.3dsx
            build/*.cia
            build/*.elf
            build/*.smdh
          if-no-files-found: warn
